<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Random Quote & Color Generator</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background-color: #1e293b;
      color: #f8fafc;
      transition: background-color 0.5s ease;
    }

    .card {
      background: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(10px);
      padding: 2.5rem;
      border-radius: 16px;
      max-width: 480px;
      width: 90%;
      text-align: center;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
    }

    h1 {
      font-size: 1.25rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #94a3b8;
      margin-bottom: 1.5rem;
    }

    #quote {
      font-size: 1.5rem;
      line-height: 1.4;
      margin-bottom: 1rem;
      font-weight: 500;
    }

    #author {
      font-size: 0.95rem;
      color: #cbd5e1;
      margin-bottom: 2rem;
    }

    button {
      background-color: #38bdf8;
      color: #0f172a;
      border: none;
      padding: 0.75rem 1.5rem;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: transform 0.15s ease, background-color 0.2s ease;
    }

    button:hover {
      background-color: #7dd3fc;
      transform: translateY(-2px);
    }

    button:active {
      transform: translateY(0);
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Daily Spark</h1>
    <p id="quote">"Simplicity is the soul of efficiency."</p>
    <p id="author">— Austin Freeman</p>
    <button onclick="generateRandom()">New Quote & Color</button>
  </div>

  <script>
    const quotes = [
      { text: "Simplicity is the soul of efficiency.", author: "Austin Freeman" },
      { text: "Code is like humor. When you have to explain it, it’s bad.", author: "Cory House" },
      { text: "First, solve the problem. Then, write the code.", author: "John Johnson" },
      { text: "Make it work, make it right, make it fast.", author: "Kent Beck" },
      { text: "Talk is cheap. Show me the code.", author: "Linus Torvalds" }
    ];

    const colors = ["#1e293b", "#312e81", "#064e3b", "#701a75", "#7c2d12", "#1e3a8a"];

    function generateRandom() {
      const randomQuote = quotes[Math.floor(Math.random() * quotes.length)];
      const randomColor = colors[Math.floor(Math.random() * colors.length)];

      document.getElementById("quote").textContent = `"${randomQuote.text}"`;
      document.getElementById("author").textContent = `— ${randomQuote.author}`;
      document.body.style.backgroundColor = randomColor;
    }
  </script>

</body>
</html>
